name: Colosseum Emerald CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-emerald:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build Emerald ROM
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" -O all 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-emerald-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload Emerald ROM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-emerald-build
          path: |
            pokeemerald.gba
            pokeemerald.elf
            pokeemerald.map
          if-no-files-found: error
